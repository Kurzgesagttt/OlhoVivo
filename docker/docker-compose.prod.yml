name: olho-do-bairro-prod

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: ../.env.production
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
